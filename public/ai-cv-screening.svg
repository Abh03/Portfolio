<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI CV Screening workflow</title>
  <desc id="desc">A job description and CV lead to evidence and recruiter review.</desc>
